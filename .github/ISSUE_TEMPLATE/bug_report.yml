name: MCP bug report
description: A problem with the Notes and Reminders MCP server.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, account identifiers, tokens or personal note and reminder content. Use synthetic examples. Report security problems privately as described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, expected behavior and actual result. Include the MCP tool or terminal helper involved, without secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux distribution and MCP client
      description: Include versions and whether a Secret Service keyring is available. Do not include account details.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Redacted technical output
      description: Optional. Review all output and remove secrets and personal data before posting.
      render: text