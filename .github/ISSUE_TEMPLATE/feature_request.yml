name: MCP feature request
description: A proposed change to the Notes and Reminders MCP server.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? Use synthetic examples without personal content.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include expected read/write behavior and any approval or privacy implications.
    validations:
      required: true