# Optional local supply-chain checks on Rust dependencies with cargo-deny:
# known vulnerabilities and withdrawn crates (RustSec advisories), licences, duplicate
# versions, and where crates may come from. `cargo deny check` runs it locally.

[graph]
# The MCP server's supported platform is Linux.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# Every advisory fails the check; a withdrawn (yanked) version too. An advisory that cannot be
# fixed yet is ignored here by its id only, each with the reason, and looked at again with
# every dependency update.
yanked = "deny"
ignore = [
  # Preserve the inherited exceptions for packages still present in the lockfile.
  { id = "RUSTSEC-2026-0370", reason = "zvariant remains a transitive dependency of the retained keyring stack" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names remains a transitive dependency of the retained keyring stack" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive remains a transitive dependency of the retained keyring stack" },
]

[licenses]
# Accepted licenses for the GPL-3.0-only workspace.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "Unlicense", "0BSD", "CDLA-Permissive-2.0",
  "BSL-1.0", "CC0-1.0", "LGPL-2.1-or-later", "GPL-3.0-only",
]
confidence-threshold = 0.9
# Preserve the inherited allow-list even when a license is currently unused.
unused-allowed-license = "allow"
# Skykeep's own crates are not published to crates.io.
private = { ignore = true }

[bans]
# Report duplicate dependency versions without refusing them.
multiple-versions = "warn"

[sources]
# crates.io only: no git dependency, no other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
