<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skykeep MCP Architecture — Sky & Sand</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Baloo 2', sans-serif;
    background: radial-gradient(circle at 15% 10%, #14323a 0%, #0c2027 45%, #060f13 100%);
    padding:2.2rem; color:white; position:relative; overflow:hidden;
  }
  .dot { position:absolute; border-radius:50%; opacity:.55; filter:blur(0.5px); }
  .container { max-width:960px; margin:0 auto; position:relative; z-index:2; }
  .header-row { display:flex; align-items:center; gap:.7rem; margin-bottom:.2rem; }
  .emoji { height:1.8rem; vertical-align:middle; }
  .emoji.sm { height:1em; }
  h1 { font-size:1.75rem; font-weight:800; letter-spacing:-0.01em;
       background:linear-gradient(90deg,#38bdf8,#eab308,#f97316,#2dd4bf);
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:#bfe3df; font-size:.95rem; margin:.1rem 0 1.6rem 0; font-weight:600; display:flex; align-items:center; gap:.3rem; }
  .diagram-container {
    background:rgba(16,42,48,.55); border-radius:1.6rem; border:2px solid rgba(234,179,8,.3);
    padding:1.4rem; box-shadow:0 14px 34px rgba(0,0,0,.35);
  }
  svg { width:100%; min-width:880px; display:block; }
</style>
</head>
<body>
  <div class="dot" style="width:90px;height:90px;background:#38bdf8;top:-20px;left:60%;"></div>
  <div class="dot" style="width:50px;height:50px;background:#2dd4bf;top:60px;left:8%;"></div>
  <div class="dot" style="width:36px;height:36px;background:#f97316;top:300px;left:90%;"></div>
  <div class="dot" style="width:60px;height:60px;background:#eab308;top:260px;left:2%;"></div>
  <div class="dot" style="width:24px;height:24px;background:#4ade80;top:30px;left:40%;"></div>

  <div class="container">
    <div class="header-row">
      <img class="emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f6f0.svg" alt="">
      <h1>Skykeep MCP</h1>
    </div>
    <p class="subtitle">How a reminder gets from your chat
      <img class="emoji sm" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/2728.svg" alt="">
      all the way to your iPhone
      <img class="emoji sm" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/2601.svg" alt="">
    </p>

    <div class="diagram-container">
      <svg viewBox="0 0 950 320">
        <defs>
          <marker id="arrow-sky" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#38bdf8"/></marker>
          <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2dd4bf"/></marker>
        </defs>

        <!-- Arrows (drawn first, behind boxes) -->
        <text x="219" y="158" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">talk</text>
        <line x1="192" y1="175" x2="246" y2="175" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-sky)"/>

        <text x="729" y="158" fill="#2dd4bf" font-size="12" font-weight="700" text-anchor="middle">sync</text>
        <line x1="702" y1="175" x2="756" y2="175" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>

        <!-- Hermes bubble -->
        <g>
          <rect x="20" y="125" width="172" height="100" rx="24" fill="#11293c" stroke="#38bdf8" stroke-width="2.5"/>
          <circle cx="106" cy="158" r="20" fill="#38bdf8"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f916.svg" x="94" y="146" width="24" height="24"/>
          <text x="106" y="195" fill="white" font-size="15" font-weight="700" text-anchor="middle">Hermes</text>
          <text x="106" y="213" fill="#bfe3df" font-size="10" text-anchor="middle">your chat buddy</text>
        </g>

        <!-- MCP server big bubble -->
        <g>
          <rect x="250" y="40" width="452" height="270" rx="28" fill="#122a38" stroke="#eab308" stroke-width="2.5"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f50c.svg" x="402" y="48" width="20" height="20"/>
          <text x="487" y="64" fill="#eab308" font-size="15" font-weight="700" text-anchor="middle">Skykeep MCP server</text>

          <!-- Active chips -->
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/2705.svg" x="272" y="88" width="13" height="13"/>
          <text x="290" y="99" fill="#5eead4" font-size="11" font-weight="700">LIVE TODAY</text>
          <g>
            <rect x="270" y="108" width="185" height="58" rx="18" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
            <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f4dd.svg" x="282" y="121" width="16" height="16"/>
            <text x="368" y="130" fill="white" font-size="12.5" font-weight="700" text-anchor="middle">Notes, Reminders</text>
            <text x="368" y="145" fill="white" font-size="12.5" font-weight="700" text-anchor="middle">&amp; Drive</text>
            <text x="362" y="159" fill="#99f6e4" font-size="9" text-anchor="middle">you can read AND write</text>
          </g>
          <g>
            <rect x="480" y="108" width="197" height="58" rx="18" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
            <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f465.svg" x="492" y="121" width="16" height="16"/>
            <text x="584" y="130" fill="white" font-size="12.5" font-weight="700" text-anchor="middle">Contacts, Calendar</text>
            <text x="584" y="145" fill="white" font-size="12.5" font-weight="700" text-anchor="middle">&amp; Photos</text>
            <text x="578" y="159" fill="#99f6e4" font-size="9" text-anchor="middle">look-only, no edits</text>
          </g>

          <!-- Live since the reminders repeat work -->
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/2705.svg" x="272" y="210" width="13" height="13"/>
          <text x="290" y="221" fill="#5eead4" font-size="11" font-weight="700">ALSO LIVE</text>
          <g>
            <rect x="270" y="232" width="185" height="58" rx="18" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
            <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f501.svg" x="282" y="238" width="15" height="15"/>
            <text x="368" y="252" fill="white" font-size="12.5" font-weight="700" text-anchor="middle">Repeating reminders</text>
            <text x="368" y="267" fill="white" font-size="12.5" font-weight="700" text-anchor="middle">+ alerts</text>
            <text x="362" y="283" fill="#99f6e4" font-size="9" text-anchor="middle">daily repeat, due-time and early alerts</text>
          </g>

          <!-- Planned chips -->
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f6a7.svg" x="482" y="210" width="13" height="13"/>
          <text x="500" y="221" fill="#fdba74" font-size="11" font-weight="700">COMING SOMEDAY</text>
          <g>
            <rect x="480" y="232" width="197" height="58" rx="18" fill="transparent" stroke="#f97316" stroke-width="2" stroke-dasharray="6,5"/>
            <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/1f4e7.svg" x="492" y="245" width="16" height="16"/>
            <text x="584" y="258" fill="#ffddaa" font-size="12.5" font-weight="700" text-anchor="middle">Mail</text>
            <text x="578" y="275" fill="#bfe3df" font-size="9" text-anchor="middle">not built yet</text>
          </g>
        </g>

        <!-- Apple bubble -->
        <g>
          <rect x="758" y="125" width="172" height="100" rx="24" fill="#0f3a36" stroke="#2dd4bf" stroke-width="2.5"/>
          <circle cx="844" cy="158" r="20" fill="#2dd4bf"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@latest/assets/svg/2601.svg" x="832" y="146" width="24" height="24"/>
          <text x="844" y="195" fill="white" font-size="15" font-weight="700" text-anchor="middle">Apple iCloud</text>
          <text x="844" y="213" fill="#bfe3df" font-size="10" text-anchor="middle">where it really lives</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
