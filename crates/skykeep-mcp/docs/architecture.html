<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iCloud-MCP Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#060f13; }
  :root {
    --sky:#38bdf8; --sand:#eab308; --sand-soft:#fcd34d; --teal:#2dd4bf; --orange:#f97316;
    --text:#ffffff; --muted:#bfe3df; --bg:#0c2027;
  }
  body {
    font-family:'Baloo 2', sans-serif; width:1260px;
    background: radial-gradient(circle at 15% 10%, #14323a 0%, #0c2027 45%, #060f13 100%);
    background-color:var(--bg);
    padding:2rem; color:var(--text); position:relative; overflow:hidden;
  }
  .dot { position:absolute; border-radius:50%; opacity:.5; }
  .container { margin:0 auto; position:relative; z-index:2; }
  .header-row { display:flex; align-items:center; gap:.7rem; }
  .emoji { height:1.9rem; }
  h1 { font-size:1.9rem; font-weight:800;
       background:linear-gradient(90deg,var(--sky),var(--sand),var(--orange),var(--teal));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:var(--muted); font-size:1rem; margin:.1rem 0 1.2rem 0; font-weight:600; }
  .diagram-container {
    background:rgba(16,42,48,.55); border-radius:1.6rem; border:2px solid rgba(234,179,8,.3);
    padding:1.2rem;
  }
  svg { width:100%; display:block; font-family:'Baloo 2', sans-serif; }
</style>
</head>
<body>
  <div class="dot" style="width:90px;height:90px;background:var(--sky);top:-30px;left:62%;"></div>
  <div class="dot" style="width:46px;height:46px;background:var(--teal);top:40px;left:90%;"></div>
  <div class="dot" style="width:30px;height:30px;background:var(--orange);top:24px;left:44%;"></div>

  <div class="container">
    <div class="header-row">
      <img class="emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f6f0.svg" alt="">
      <h1>iCloud-MCP</h1>
    </div>
    <p class="subtitle">What runs on main today, and where each request goes</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1200 600">
        <defs>
          <marker id="a-sky" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto-start-reverse"><polygon points="0 0,13 5.5,0 11" fill="#38bdf8"/></marker>
          <marker id="a-teal" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto-start-reverse"><polygon points="0 0,13 5.5,0 11" fill="#2dd4bf"/></marker>
          <marker id="a-sand" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto-start-reverse"><polygon points="0 0,13 5.5,0 11" fill="#eab308"/></marker>
        </defs>

        <!-- ===== Left column ===== -->
        <!-- MCP client with the approval card -->
        <g>
          <rect x="20" y="50" width="250" height="170" rx="22" fill="#11293c" stroke="#38bdf8" stroke-width="2.5"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4ac.svg" x="38" y="66" width="22" height="22"/>
          <text x="68" y="84" fill="white" font-size="16" font-weight="700">Hermes or another</text>
          <text x="38" y="104" fill="white" font-size="16" font-weight="700">MCP client</text>
          <text x="38" y="122" fill="#bfe3df" font-size="11">starts skykeep-mcp, talks over stdio</text>
          <rect x="36" y="134" width="218" height="72" rx="14" fill="#0f3550" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
          <text x="50" y="154" fill="#38bdf8" font-size="12" font-weight="700">Approval card</text>
          <text x="50" y="172" fill="white" font-size="11">Approve this time · Deny</text>
          <text x="50" y="188" fill="white" font-size="11">Always allow this action</text>
          <text x="50" y="200" fill="#bfe3df" font-size="9">(no "Always allow" for permanent deletions)</text>
        </g>

        <!-- Own terminal -->
        <g>
          <rect x="20" y="262" width="250" height="118" rx="22" fill="#1d2a26" stroke="#eab308" stroke-width="2.5"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4bb.svg" x="38" y="276" width="22" height="22"/>
          <text x="68" y="294" fill="white" font-size="16" font-weight="700">Your own terminal</text>
          <text x="38" y="318" fill="#fcd34d" font-size="12" font-weight="600">setup · status · unlock</text>
          <text x="38" y="336" fill="#fcd34d" font-size="12" font-weight="600">exchange · approve · permissions show</text>
          <text x="38" y="358" fill="#bfe3df" font-size="11">Apple sign-in happens only here,</text>
          <text x="38" y="372" fill="#bfe3df" font-size="11">never through the assistant</text>
        </g>

        <!-- Exchange folder -->
        <g>
          <rect x="20" y="408" width="250" height="60" rx="18" fill="#1d2a26" stroke="#eab308" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4c2.svg" x="36" y="425" width="22" height="22"/>
          <text x="66" y="434" fill="white" font-size="14" font-weight="700">Exchange folder</text>
          <text x="66" y="452" fill="#bfe3df" font-size="11">the only local files Drive reads or writes</text>
        </g>

        <!-- ===== Arrows between left column and server ===== -->
        <text x="315" y="88" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">tool call</text>
        <line x1="274" y1="100" x2="356" y2="100" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <text x="315" y="154" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">ask: client</text>
        <line x1="356" y1="166" x2="274" y2="166" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <text x="315" y="306" fill="#eab308" font-size="11" font-weight="700" text-anchor="middle">ask: terminal</text>
        <line x1="274" y1="320" x2="356" y2="320" stroke="#eab308" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sand)"/>
        <text x="315" y="424" fill="#eab308" font-size="11" font-weight="700" text-anchor="middle">upload</text>
        <text x="315" y="460" fill="#eab308" font-size="11" font-weight="700" text-anchor="middle">download</text>
        <line x1="274" y1="438" x2="356" y2="438" stroke="#eab308" stroke-width="3" stroke-linecap="round" marker-start="url(#a-sand)" marker-end="url(#a-sand)"/>

        <!-- ===== Server ===== -->
        <g>
          <rect x="360" y="20" width="540" height="508" rx="26" fill="#122a38" stroke="#eab308" stroke-width="2.5"/>
          <text x="630" y="46" fill="#eab308" font-size="16" font-weight="700" text-anchor="middle">iCloud-MCP server (skykeep-mcp)</text>

          <!-- Permissions file gate -->
          <rect x="380" y="60" width="500" height="66" rx="16" fill="#2a2a1c" stroke="#eab308" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f512.svg" x="394" y="72" width="18" height="18"/>
          <text x="420" y="86" fill="white" font-size="14" font-weight="700">Permissions file</text>
          <text x="545" y="86" fill="#fcd34d" font-size="12" font-weight="600">allow · ask: client · ask: terminal · deny</text>
          <text x="394" y="104" fill="#bfe3df" font-size="11">One rule per tool or action, read at every tool call, so an edit counts at the next call.</text>
          <text x="394" y="118" fill="#bfe3df" font-size="11">Unlisted actions follow the approval mode. "Always allow" on the card saves an allow rule.</text>

          <!-- Route rows -->
          <!-- Notes -->
          <rect x="380" y="140" width="500" height="44" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4dd.svg" x="392" y="152" width="20" height="20"/>
          <text x="420" y="167" fill="white" font-size="14" font-weight="700">Notes</text>
          <text x="505" y="158" fill="#d1faf3" font-size="11">list, search, read</text>
          <text x="505" y="173" fill="#d1faf3" font-size="11">create, save, move, pin, delete, queued until sync</text>
          <rect x="790" y="152" width="80" height="20" rx="10" fill="#2dd4bf"/>
          <text x="830" y="166" fill="#06201c" font-size="10" font-weight="800" text-anchor="middle">READ + WRITE</text>

          <!-- Reminders -->
          <rect x="380" y="194" width="500" height="44" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/23f0.svg" x="392" y="206" width="20" height="20"/>
          <text x="420" y="221" fill="white" font-size="14" font-weight="700">Reminders</text>
          <text x="505" y="212" fill="#d1faf3" font-size="11">create, edit, tick, delete, queued until sync</text>
          <text x="505" y="227" fill="#d1faf3" font-size="11">new ones can repeat daily and alert at or before due</text>
          <rect x="790" y="206" width="80" height="20" rx="10" fill="#2dd4bf"/>
          <text x="830" y="220" fill="#06201c" font-size="10" font-weight="800" text-anchor="middle">READ + WRITE</text>

          <!-- Contacts -->
          <rect x="380" y="248" width="500" height="44" rx="14" fill="#0f3550" stroke="#38bdf8" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f465.svg" x="392" y="260" width="20" height="20"/>
          <text x="420" y="275" fill="white" font-size="14" font-weight="700">Contacts</text>
          <text x="505" y="266" fill="#dbeefa" font-size="11">list, search, read the local copy</text>
          <text x="505" y="281" fill="#dbeefa" font-size="11">contacts_refresh fills it</text>
          <rect x="790" y="260" width="80" height="20" rx="10" fill="#38bdf8"/>
          <text x="830" y="274" fill="#061a26" font-size="10" font-weight="800" text-anchor="middle">READ-ONLY</text>

          <!-- Calendar -->
          <rect x="380" y="302" width="500" height="44" rx="14" fill="#0f3550" stroke="#38bdf8" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4c5.svg" x="392" y="314" width="20" height="20"/>
          <text x="420" y="329" fill="white" font-size="14" font-weight="700">Calendar</text>
          <text x="505" y="320" fill="#dbeefa" font-size="11">calendars, events by date, search, read</text>
          <text x="505" y="335" fill="#dbeefa" font-size="11">calendar_refresh fills a date window</text>
          <rect x="790" y="314" width="80" height="20" rx="10" fill="#38bdf8"/>
          <text x="830" y="328" fill="#061a26" font-size="10" font-weight="800" text-anchor="middle">READ-ONLY</text>

          <!-- Photos -->
          <rect x="380" y="356" width="500" height="44" rx="14" fill="#0f3550" stroke="#38bdf8" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f5bc.svg" x="392" y="368" width="20" height="20"/>
          <text x="420" y="383" fill="white" font-size="14" font-weight="700">Photos</text>
          <text x="505" y="374" fill="#dbeefa" font-size="11">albums, list, search, details</text>
          <text x="505" y="389" fill="#dbeefa" font-size="11">metadata only, no pictures, places or faces</text>
          <rect x="790" y="368" width="80" height="20" rx="10" fill="#38bdf8"/>
          <text x="830" y="382" fill="#061a26" font-size="10" font-weight="800" text-anchor="middle">READ-ONLY</text>

          <!-- Drive -->
          <rect x="380" y="410" width="500" height="56" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4c1.svg" x="392" y="428" width="20" height="20"/>
          <text x="420" y="443" fill="white" font-size="14" font-weight="700">Drive</text>
          <text x="505" y="428" fill="#d1faf3" font-size="11">list, search, read details, refresh one folder</text>
          <text x="505" y="443" fill="#d1faf3" font-size="11">create folder, rename, move, trash, delete forever,</text>
          <text x="505" y="458" fill="#d1faf3" font-size="11">upload, download; runs at once, deletions need you</text>
          <rect x="790" y="428" width="80" height="20" rx="10" fill="#2dd4bf"/>
          <text x="830" y="442" fill="#06201c" font-size="10" font-weight="800" text-anchor="middle">READ + WRITE</text>

          <!-- Mail: not built, no route -->
          <rect x="380" y="476" width="500" height="40" rx="14" fill="transparent" stroke="#f97316" stroke-width="2" stroke-dasharray="6,5"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4e7.svg" x="392" y="486" width="20" height="20"/>
          <text x="420" y="501" fill="#ffddaa" font-size="14" font-weight="700">Mail</text>
          <text x="505" y="501" fill="#ffddaa" font-size="11">not built and not planned: upstream Skykeep has no Mail</text>
          <rect x="790" y="486" width="80" height="20" rx="10" fill="none" stroke="#f97316" stroke-width="1.5"/>
          <text x="830" y="500" fill="#fdba74" font-size="10" font-weight="800" text-anchor="middle">NO ROUTE</text>
        </g>

        <!-- ===== Arrows between server and iCloud ===== -->
        <line x1="884" y1="162" x2="996" y2="162" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="884" y1="216" x2="996" y2="216" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="996" y1="270" x2="884" y2="270" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <line x1="996" y1="324" x2="884" y2="324" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <line x1="996" y1="378" x2="884" y2="378" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <line x1="884" y1="438" x2="996" y2="438" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <text x="940" y="152" fill="#2dd4bf" font-size="11" font-weight="700" text-anchor="middle">sync</text>
        <text x="940" y="260" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">*_refresh</text>

        <!-- ===== Apple iCloud ===== -->
        <g>
          <rect x="1000" y="140" width="180" height="320" rx="26" fill="#0f3a36" stroke="#2dd4bf" stroke-width="2.5"/>
          <circle cx="1090" cy="270" r="26" fill="#2dd4bf"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/2601.svg" x="1074" y="254" width="32" height="32"/>
          <text x="1090" y="320" fill="white" font-size="17" font-weight="700" text-anchor="middle">Apple iCloud</text>
          <text x="1090" y="340" fill="#bfe3df" font-size="11" text-anchor="middle">your Apple Account</text>
        </g>

        <!-- ===== Legend ===== -->
        <g font-size="12" font-weight="600">
          <line x1="380" y1="566" x2="430" y2="566" stroke="#2dd4bf" stroke-width="3" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
          <text x="442" y="570" fill="#bfe3df">reads and writes</text>
          <line x1="580" y1="566" x2="630" y2="566" stroke="#38bdf8" stroke-width="3" marker-end="url(#a-sky)"/>
          <text x="642" y="570" fill="#bfe3df">reads only</text>
          <rect x="752" y="556" width="40" height="20" rx="8" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,4"/>
          <text x="804" y="570" fill="#bfe3df">not built, no arrow</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
