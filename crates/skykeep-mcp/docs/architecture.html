<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iCloud-MCP Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background:#060f13; }
  :root {
    --sky:#38bdf8; --sand:#eab308; --sand-soft:#fcd34d; --teal:#2dd4bf; --orange:#f97316;
    --text:#ffffff; --muted:#bfe3df; --bg:#0c2027;
  }
  body {
    font-family:'Baloo 2', sans-serif; width:1320px;
    background: radial-gradient(circle at 15% 10%, #14323a 0%, #0c2027 45%, #060f13 100%);
    background-color:var(--bg);
    padding:2rem; color:var(--text); position:relative; overflow:hidden;
  }
  .dot { position:absolute; border-radius:50%; opacity:.5; }
  .container { margin:0 auto; position:relative; z-index:2; }
  .header-row { display:flex; align-items:center; gap:.7rem; }
  .emoji { height:1.9rem; }
  h1 { font-size:1.9rem; font-weight:800;
       background:linear-gradient(90deg,var(--sky),var(--sand),var(--orange),var(--teal));
       -webkit-background-clip:text; background-clip:text; color:transparent; }
  .subtitle { color:var(--muted); font-size:1rem; margin:.1rem 0 1.2rem 0; font-weight:600; }
  .diagram-container {
    background:rgba(16,42,48,.55); border-radius:1.6rem; border:2px solid rgba(234,179,8,.3);
    padding:1.2rem;
  }
  svg { width:100%; display:block; font-family:'Baloo 2', sans-serif; }
</style>
</head>
<body>
  <div class="dot" style="width:90px;height:90px;background:var(--sky);top:-30px;left:62%;"></div>
  <div class="dot" style="width:46px;height:46px;background:var(--teal);top:40px;left:90%;"></div>
  <div class="dot" style="width:30px;height:30px;background:var(--orange);top:24px;left:44%;"></div>

  <div class="container">
    <div class="header-row">
      <img class="emoji" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f6f0.svg" alt="">
      <h1>iCloud-MCP</h1>
    </div>
    <p class="subtitle">What runs on main today, and where each request goes</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1260 606">
        <defs>
          <marker id="a-sky" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto-start-reverse"><polygon points="0 0,13 5.5,0 11" fill="#38bdf8"/></marker>
          <marker id="a-teal" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto-start-reverse"><polygon points="0 0,13 5.5,0 11" fill="#2dd4bf"/></marker>
          <marker id="a-sand" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="11" refY="5.5" orient="auto-start-reverse"><polygon points="0 0,13 5.5,0 11" fill="#eab308"/></marker>
        </defs>

        <!-- ===== MCP client with a usage example ===== -->
        <g>
          <rect x="20" y="40" width="296" height="340" rx="22" fill="#11293c" stroke="#38bdf8" stroke-width="2.5"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4ac.svg" x="38" y="56" width="22" height="22"/>
          <text x="68" y="74" fill="white" font-size="16" font-weight="700">Hermes or another MCP client</text>
          <text x="38" y="94" fill="#bfe3df" font-size="11">starts the server and talks to it over stdio</text>

          <!-- You: prompt bubble -->
          <path d="M44 108 h232 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-200 l-14 12 l2 -12 h-20 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" fill="#38bdf8"/>
          <text x="46" y="126" fill="#061a26" font-size="11" font-weight="800">You</text>
          <text x="46" y="142" fill="#061a26" font-size="12.5" font-weight="700">Remind me to call the dentist</text>
          <text x="46" y="158" fill="#061a26" font-size="12.5" font-weight="700">tomorrow at 9</text>

          <line x1="168" y1="172" x2="168" y2="194" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-sand)"/>

          <!-- Tool call code block -->
          <rect x="30" y="200" width="280" height="132" rx="12" fill="#0a1a22" stroke="#eab308" stroke-width="1.5"/>
          <text x="40" y="220" fill="#fcd34d" font-size="12" font-weight="700" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">reminders_write</text>
          <text x="40" y="237" fill="#e6f4f1" font-size="10.5" font-weight="500" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">{ "action": "create",</text>
          <text x="40" y="254" fill="#e6f4f1" font-size="10.5" font-weight="500" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  "list_guid": "&lt;from reminders_lists&gt;",</text>
          <text x="40" y="271" fill="#e6f4f1" font-size="10.5" font-weight="500" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  "title": "Call the dentist",</text>
          <text x="40" y="288" fill="#e6f4f1" font-size="10.5" font-weight="500" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  "due_at": 1795420800,</text>
          <text x="40" y="305" fill="#e6f4f1" font-size="10.5" font-weight="500" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  "due_time_alert": true,</text>
          <text x="40" y="322" fill="#e6f4f1" font-size="10.5" font-weight="500" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">  "timezone": "Europe/Berlin" }</text>
          <text x="38" y="352" fill="#bfe3df" font-size="10.5">due_at is tomorrow 09:00 Berlin time in Unix seconds;</text>
          <text x="38" y="366" fill="#bfe3df" font-size="10.5">the reminder alerts at that time</text>
        </g>

        <!-- Exchange folder -->
        <g>
          <rect x="20" y="446" width="296" height="60" rx="18" fill="#1d2a26" stroke="#eab308" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4c2.svg" x="36" y="465" width="22" height="22"/>
          <text x="66" y="472" fill="white" font-size="14" font-weight="700">Exchange folder</text>
          <text x="66" y="490" fill="#bfe3df" font-size="11">file contents for Drive and Photos pass only here</text>
        </g>

        <!-- ===== Arrows between left column and server ===== -->
        <text x="368" y="142" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">tool call</text>
        <line x1="320" y1="150" x2="416" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <text x="368" y="236" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">approval</text>
        <text x="368" y="249" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">card</text>
        <line x1="416" y1="258" x2="320" y2="258" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sky)"/>
        <text x="368" y="464" fill="#eab308" font-size="11" font-weight="700" text-anchor="middle">upload</text>
        <text x="368" y="500" fill="#eab308" font-size="11" font-weight="700" text-anchor="middle">download</text>
        <line x1="320" y1="476" x2="416" y2="476" stroke="#eab308" stroke-width="3" stroke-linecap="round" marker-start="url(#a-sand)" marker-end="url(#a-sand)"/>

        <g transform="translate(60,0)">
        <!-- ===== Server ===== -->
        <g>
          <rect x="360" y="20" width="540" height="540" rx="26" fill="#122a38" stroke="#eab308" stroke-width="2.5"/>
          <text x="630" y="46" fill="#eab308" font-size="16" font-weight="700" text-anchor="middle">iCloud-MCP server</text>

          <!-- Permissions file -->
          <rect x="380" y="60" width="500" height="84" rx="16" fill="#2a2a1c" stroke="#eab308" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f512.svg" x="394" y="72" width="18" height="18"/>
          <text x="420" y="86" fill="white" font-size="14" font-weight="700">Permissions file</text>
          <text x="545" y="86" fill="#fcd34d" font-size="12" font-weight="600">allow · ask · deny, per tool and action</text>
          <text x="394" y="104" fill="#bfe3df" font-size="11">Read at every tool call, so an edit counts at the next call.</text>
          <text x="394" y="119" fill="#bfe3df" font-size="11">Actions without a rule follow the approval mode chosen in setup.</text>
          <text x="394" y="134" fill="#bfe3df" font-size="11">Deletions in Drive, Contacts, Calendar and Photos always need a person.</text>

          <rect x="380" y="156" width="500" height="50" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4dd.svg" x="392" y="171.0" width="20" height="20"/>
          <text x="420" y="186.0" fill="white" font-size="14" font-weight="700">Notes</text>
          <text x="505" y="177.0" fill="#d1faf3" font-size="11.5">list, search, read</text>
          <text x="505" y="193.0" fill="#d1faf3" font-size="11.5">create, save, move, pin, delete</text>
          <rect x="380" y="214" width="500" height="50" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/23f0.svg" x="392" y="229.0" width="20" height="20"/>
          <text x="420" y="244.0" fill="white" font-size="14" font-weight="700">Reminders</text>
          <text x="505" y="235.0" fill="#d1faf3" font-size="11.5">list, search, read; create, edit, tick, delete</text>
          <text x="505" y="251.0" fill="#d1faf3" font-size="11.5">new ones can repeat daily, alert at or before due, keep a time zone</text>
          <rect x="380" y="272" width="500" height="50" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f465.svg" x="392" y="287.0" width="20" height="20"/>
          <text x="420" y="302.0" fill="white" font-size="14" font-weight="700">Contacts</text>
          <text x="505" y="293.0" fill="#d1faf3" font-size="11.5">list, search, read; create, update, delete one card</text>
          <text x="505" y="309.0" fill="#d1faf3" font-size="11.5">an update or delete must name the card's current version</text>
          <rect x="380" y="330" width="500" height="50" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4c5.svg" x="392" y="345.0" width="20" height="20"/>
          <text x="420" y="360.0" fill="white" font-size="14" font-weight="700">Calendar</text>
          <text x="505" y="351.0" fill="#d1faf3" font-size="11.5">read events; create, update, move, delete</text>
          <text x="505" y="367.0" fill="#d1faf3" font-size="11.5">a whole series or one occurrence; invitations refused by default</text>
          <rect x="380" y="388" width="500" height="50" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f5bc.svg" x="392" y="403.0" width="20" height="20"/>
          <text x="420" y="418.0" fill="white" font-size="14" font-weight="700">Photos</text>
          <text x="505" y="409.0" fill="#d1faf3" font-size="11.5">metadata only; upload from the exchange folder</text>
          <text x="505" y="425.0" fill="#d1faf3" font-size="11.5">favorite, title and caption, rating, keywords, date, albums, trash</text>
          <rect x="380" y="446" width="500" height="50" rx="14" fill="#0e4a3a" stroke="#2dd4bf" stroke-width="2"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4c1.svg" x="392" y="461.0" width="20" height="20"/>
          <text x="420" y="476.0" fill="white" font-size="14" font-weight="700">Drive</text>
          <text x="505" y="467.0" fill="#d1faf3" font-size="11.5">list, search, read; create folder, rename, move, trash,</text>
          <text x="505" y="483.0" fill="#d1faf3" font-size="11.5">delete for good, upload and download through the exchange folder</text>

          <!-- Commands in your own terminal -->
          <rect x="380" y="508" width="500" height="40" rx="14" fill="#1d2a26" stroke="#eab308" stroke-width="1.5"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f4bb.svg" x="392" y="518" width="20" height="20"/>
          <text x="420" y="533" fill="white" font-size="13" font-weight="700">setup · status · unlock</text>
          <text x="585" y="526" fill="#bfe3df" font-size="11">run in your own terminal: sign in, check the folder,</text>
          <text x="585" y="540" fill="#bfe3df" font-size="11">open the protected sign-in file after a restart</text>
        </g>

        <!-- ===== Arrows between server and iCloud ===== -->
        <line x1="904" y1="181.0" x2="996" y2="181.0" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="904" y1="239.0" x2="996" y2="239.0" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="904" y1="297.0" x2="996" y2="297.0" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="904" y1="355.0" x2="996" y2="355.0" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="904" y1="413.0" x2="996" y2="413.0" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
        <line x1="904" y1="471.0" x2="996" y2="471.0" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>

        <!-- ===== Apple iCloud ===== -->
        <g>
          <rect x="1000" y="156" width="180" height="340" rx="26" fill="#0f3a36" stroke="#2dd4bf" stroke-width="2.5"/>
          <circle cx="1090" cy="300.0" r="26" fill="#2dd4bf"/>
          <image href="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/2601.svg" x="1074" y="284.0" width="32" height="32"/>
          <text x="1090" y="350.0" fill="white" font-size="17" font-weight="700" text-anchor="middle">Apple iCloud</text>
          <text x="1090" y="370.0" fill="#bfe3df" font-size="11" text-anchor="middle">your Apple Account</text>
        </g>

        <!-- ===== Legend ===== -->
        <g font-size="12" font-weight="600">
          <line x1="520" y1="584" x2="570" y2="584" stroke="#2dd4bf" stroke-width="3" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
          <text x="582" y="588" fill="#bfe3df">reads and writes: all six services</text>
        </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
