[package]
name = "skykeep-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
zeroize = "1"
quince-auth = { path = "../quince-auth" }
quince-core = { path = "../quince-core" }
quince-icloud = { path = "../quince-icloud" }
quince-sync = { path = "../quince-sync" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "time", "sync"] }
uuid.workspace = true

[dev-dependencies]
quince-auth = { path = "../quince-auth", features = ["loopback"] }
wiremock = "0.6"
base64 = "0.22"
tempfile = "3"
