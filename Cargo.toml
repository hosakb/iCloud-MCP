[workspace]
resolver = "2"
default-members = ["crates/skykeep-mcp"]
members = ["crates/skykeep-mcp", "crates/quince-auth", "crates/quince-core", "crates/quince-icloud", "crates/quince-sync"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "rustls-tls", "stream", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
# Numbers read back exactly as written: Apple's records carry long decimals (Reminders' section
# timestamps), and a save that re-wrote them a few digits off would change other records.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

# Keep line tables for workspace code and omit full dependency debug symbols.
[profile.dev]
debug = "line-tables-only"
# Preserve the engine's development optimization settings.
opt-level = 1

[profile.dev.package."*"]
debug = false
opt-level = 3

# Preserve release profile values. Unwinding lets quince-core roll back a transaction
# that panics instead of aborting the server process.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
